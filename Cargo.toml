[package]
name = "uicontrol"
version = "0.1.0"
edition = "2021"

[dependencies]
enigo = "0.6.1"
anyhow = "1"
axum = "0.7"
rmcp = { version = "0.14.0", features = ["server", "transport-streamable-http-server"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
